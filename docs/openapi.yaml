components:
  schemas:
    AprobarProformaRespuesta:
      type: object
      properties:
        pedido_id:
          type: integer
          readOnly: true
        estado:
          type: string
          readOnly: true
      required:
      - estado
      - pedido_id
    ArchivoAdjunto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        tamano_bytes:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - id
      - mime_type
      - nombre
      - tamano_bytes
      - url
    CambiarEstadoPedido:
      type: object
      properties:
        estado_codigo:
          $ref: '#/components/schemas/EstadoCodigoEnum'
      required:
      - estado_codigo
    CapturaAceptada:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        estado:
          type: string
          readOnly: true
        intento_id:
          type: integer
          readOnly: true
        numero_intento:
          type: integer
          readOnly: true
        reutilizada:
          type: boolean
          readOnly: true
      required:
      - estado
      - id
      - intento_id
      - numero_intento
      - reutilizada
    CapturaRevision:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proforma:
          type: integer
          readOnly: true
        proforma_detalle:
          type: integer
          readOnly: true
        estado:
          type: string
          readOnly: true
        texto_transcrito:
          type: string
          readOnly: true
          nullable: true
        intento_id:
          type: integer
          readOnly: true
        item_ia:
          allOf:
          - $ref: '#/components/schemas/ItemIA'
          nullable: true
          readOnly: true
        incorporada:
          type: boolean
          readOnly: true
      required:
      - estado
      - id
      - incorporada
      - intento_id
      - item_ia
      - proforma
      - proforma_detalle
      - texto_transcrito
    CargaArchivoImagen:
      type: object
      properties:
        archivo:
          type: string
          format: uri
      required:
      - archivo
    CargaImagen:
      type: object
      properties:
        archivo:
          type: string
          format: uri
      required:
      - archivo
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo_cliente:
          type: integer
        nombres:
          type: string
          nullable: true
          maxLength: 150
        apellidos:
          type: string
          nullable: true
          maxLength: 150
        empresa:
          type: string
          nullable: true
          maxLength: 200
        celular:
          type: string
          nullable: true
          maxLength: 40
        direccion:
          type: string
          nullable: true
        observaciones:
          type: string
          nullable: true
        activo:
          type: boolean
        created_by:
          type: integer
          readOnly: true
          nullable: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_by
      - id
      - tipo_cliente
      - updated_by
    ConfirmacionHITLRespuesta:
      type: object
      properties:
        captura_id:
          type: integer
          readOnly: true
        detalle_id:
          type: integer
          readOnly: true
        item_humano_id:
          type: integer
          readOnly: true
        evaluacion_id:
          type: integer
          readOnly: true
        proforma_estado:
          type: string
          readOnly: true
      required:
      - captura_id
      - detalle_id
      - evaluacion_id
      - item_humano_id
      - proforma_estado
    ConfirmarCaptura:
      type: object
      properties:
        intento_id:
          type: integer
          minimum: 1
        item_ia_id:
          type: integer
          minimum: 1
        item_corregido:
          $ref: '#/components/schemas/ItemCorregido'
        linea_comercial:
          $ref: '#/components/schemas/LineaComercialHITL'
      required:
      - intento_id
      - item_corregido
      - item_ia_id
      - linea_comercial
    CrearCapturaMultipart:
      type: object
      description: Esquema OpenAPI multipart; mantiene la regla runtime de exactamente
        un input.
      properties:
        clave_idempotencia:
          type: string
          format: uuid
        proforma:
          type: integer
          minimum: 1
        proforma_detalle:
          type: integer
          minimum: 1
          nullable: true
        texto:
          type: string
        audio:
          type: string
          format: binary
          writeOnly: true
      required:
      - clave_idempotencia
      - proforma
    CrearCapturaTexto:
      type: object
      description: Esquema OpenAPI exacto para recepción JSON/form de texto.
      properties:
        clave_idempotencia:
          type: string
          format: uuid
        proforma:
          type: integer
          minimum: 1
        proforma_detalle:
          type: integer
          minimum: 1
          nullable: true
        texto:
          type: string
      required:
      - clave_idempotencia
      - proforma
      - texto
    CrearProforma:
      type: object
      properties:
        cliente:
          type: integer
          nullable: true
        titulo:
          type: string
          nullable: true
          maxLength: 250
        plazo_entrega:
          type: string
          nullable: true
          maxLength: 100
        validez_oferta:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
        porcentaje_adelanto:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        moneda_codigo:
          allOf:
          - $ref: '#/components/schemas/MonedaCodigoEnum'
          writeOnly: true
          default: BOB
        observaciones:
          type: string
          nullable: true
        prospecto_nombre:
          type: string
          nullable: true
          maxLength: 250
        prospecto_empresa:
          type: string
          nullable: true
          maxLength: 200
        prospecto_celular:
          type: string
          nullable: true
          maxLength: 40
        prospecto_direccion:
          type: string
          nullable: true
    DescuentoProducto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        precio_antes:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        precio_ahora:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        fecha_inicio:
          type: string
          format: date
          nullable: true
        fecha_fin:
          type: string
          format: date
          nullable: true
        activo:
          type: boolean
        producto:
          type: integer
      required:
      - id
      - precio_ahora
      - precio_antes
      - producto
    DetalleProforma:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proforma:
          type: integer
          readOnly: true
        tipo_item:
          type: integer
        producto:
          type: integer
          nullable: true
        nombre:
          type: string
          maxLength: 250
        descripcion:
          type: string
          nullable: true
        cantidad:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        unidad:
          type: integer
        modo_calculo:
          type: string
          maxLength: 20
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        importe_negociado:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        descuento:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        precio_antes_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        precio_ahora_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        especificacion:
          allOf:
          - $ref: '#/components/schemas/EspecificacionMueble'
          readOnly: true
      required:
      - cantidad
      - especificacion
      - id
      - nombre
      - precio_ahora_snapshot
      - precio_antes_snapshot
      - proforma
      - tipo_item
      - total
      - unidad
    EmitirRecibo:
      type: object
      properties:
        nombre_completo:
          type: string
          maxLength: 250
        monto_en_letras:
          type: string
        concepto:
          type: string
        tipo_pago:
          type: integer
        numero_cheque:
          type: string
          nullable: true
        banco:
          type: string
          nullable: true
        pago_actual:
