openapi: 3.0.3
info:
  title: HOMEX Backend API
  version: v1
  description: API comercial de HOMEX.
paths:
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentidadActual'
          description: ''
        '401':
          description: Autenticación requerida.
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/capturas/:
    post:
      operationId: v1_capturas_create
      description: Los textos nuevos admiten hasta 20000 caracteres. Una solicitud
        histórica más extensa sólo puede repetir su comprobante si coinciden clave,
        actor, proforma, detalle y hash del texto; nunca crea nuevo trabajo.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCapturaTexto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrearCapturaTexto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearCapturaMultipart'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturaAceptada'
          description: ''
        '409':
          description: La clave de idempotencia ya fue utilizada con otra solicitud.
  /api/v1/capturas/{id}/:
    get:
      operationId: v1_capturas_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este captura.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturaRevision'
          description: ''
  /api/v1/capturas/{id}/confirmar/:
    post:
      operationId: v1_capturas_confirmar_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este captura.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarCaptura'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmacionHITLRespuesta'
          description: ''
        '400':
          description: Payload inválido, captura no procesable o proforma no editable.
        '409':
          description: La captura ya tiene una confirmación final o ya está vinculada
            a un detalle comercial.
        '415':
          description: La confirmación HITL acepta application/json.
  /api/v1/capturas/asistidas/:
    post:
      operationId: v1_capturas_asistidas_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAsistida'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearAsistida'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrearAsistida'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturaAceptada'
          description: ''
        '400':
          description: Entrada o contexto de borrador inválidos.
        '401':
          description: Se requiere autenticación.
        '403':
          description: Sin permiso comercial o de proforma.
        '404':
          description: Captura de origen o proforma no disponible.
        '409':
          description: Idempotencia incompatible.
        '415':
          description: Tipo de contenido no admitido.
  /api/v1/capturas/asistidas/{id}/:
    get:
      operationId: v1_capturas_asistidas_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este captura.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAsistida'
          description: ''
  /api/v1/capturas/catalogo/:
    post:
      operationId: v1_capturas_catalogo_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCatalogo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearCatalogo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrearCatalogo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturaAceptada'
          description: ''
  /api/v1/capturas/catalogo/{id}/:
    get:
      operationId: v1_capturas_catalogo_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este captura.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCatalogo'
          description: ''
  /api/v1/catalogo/atributos-mueble/:
    get:
      operationId: v1_catalogo_atributos_mueble_list
      parameters:
      - in: query
        name: search
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoAtributosMueble'
          description: ''
  /api/v1/catalogo/descuentos/:
    get:
      operationId: v1_catalogo_descuentos_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DescuentoProducto'
          description: ''
    post:
      operationId: v1_catalogo_descuentos_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescuentoProducto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DescuentoProducto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DescuentoProducto'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescuentoProducto'
          description: ''
  /api/v1/catalogo/descuentos/{id}/:
    get:
      operationId: v1_catalogo_descuentos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este descuento producto.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescuentoProducto'
          description: ''
    put:
      operationId: v1_catalogo_descuentos_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este descuento producto.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescuentoProducto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DescuentoProducto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DescuentoProducto'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescuentoProducto'
          description: ''
    patch:
      operationId: v1_catalogo_descuentos_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este descuento producto.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDescuentoProducto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDescuentoProducto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDescuentoProducto'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescuentoProducto'
          description: ''
    delete:
      operationId: v1_catalogo_descuentos_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este descuento producto.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalogo/familias/:
    get:
      operationId: v1_catalogo_familias_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFamiliaProductoList'
          description: ''
    post:
      operationId: v1_catalogo_familias_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamiliaProducto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FamiliaProducto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FamiliaProducto'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamiliaProducto'
          description: ''
  /api/v1/catalogo/familias/{id}/:
    get:
      operationId: v1_catalogo_familias_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este familia producto.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamiliaProducto'
          description: ''
    put:
      operationId: v1_catalogo_familias_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este familia producto.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamiliaProducto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FamiliaProducto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FamiliaProducto'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamiliaProducto'
          description: ''
    patch:
      operationId: v1_catalogo_familias_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este familia producto.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFamiliaProducto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFamiliaProducto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFamiliaProducto'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamiliaProducto'
          description: ''
    delete:
      operationId: v1_catalogo_familias_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este familia producto.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalogo/opciones/:
    get:
      operationId: v1_catalogo_opciones_list
      parameters:
      - in: query
        name: concepto
        schema:
          enum:
          - ESTADO_PROFORMA
          - MONEDA
          - TIPO_ITEM
          - UNIDAD_MEDIDA
          - TIPO_MUEBLE
          - TIPO_CLIENTE
          - ESTADO_PEDIDO
          - ESTADO_ORDEN_TRABAJO
          - TIPO_PAGO
          - TIPO_MOVIMIENTO
          - CATEGORIA_PRODUCTO
          - MARCA
          - COLOR
          - TIPO_PISO
          - MATERIAL_PISO
          - DISENO_PISO
          - ACABADO_PISO
          type: string
          minLength: 1
        description: |-
          * `ESTADO_PROFORMA` - ESTADO_PROFORMA
          * `MONEDA` - MONEDA
          * `TIPO_ITEM` - TIPO_ITEM
          * `UNIDAD_MEDIDA` - UNIDAD_MEDIDA
          * `TIPO_MUEBLE` - TIPO_MUEBLE
          * `TIPO_CLIENTE` - TIPO_CLIENTE
          * `ESTADO_PEDIDO` - ESTADO_PEDIDO
          * `ESTADO_ORDEN_TRABAJO` - ESTADO_ORDEN_TRABAJO
          * `TIPO_PAGO` - TIPO_PAGO
          * `TIPO_MOVIMIENTO` - TIPO_MOVIMIENTO
          * `CATEGORIA_PRODUCTO` - CATEGORIA_PRODUCTO
          * `MARCA` - MARCA
          * `COLOR` - COLOR
          * `TIPO_PISO` - TIPO_PISO
          * `MATERIAL_PISO` - MATERIAL_PISO
          * `DISENO_PISO` - DISENO_PISO
          * `ACABADO_PISO` - ACABADO_PISO
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValorCatalogoPublico'
          description: ''
  /api/v1/catalogo/pisos/:
    get:
      operationId: v1_catalogo_pisos_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoPiso'
          description: ''
    post:
      operationId: v1_catalogo_pisos_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoPiso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoPiso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoPiso'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPiso'
          description: ''
  /api/v1/catalogo/pisos/{producto}/:
    get:
      operationId: v1_catalogo_pisos_retrieve
      parameters:
      - in: path
        name: producto
        schema:
          type: integer
        description: Un valor único que identifique este producto piso.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPiso'
          description: ''
    put:
      operationId: v1_catalogo_pisos_update
      parameters:
      - in: path
        name: producto
        schema:
          type: integer
        description: Un valor único que identifique este producto piso.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoPiso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoPiso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoPiso'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPiso'
          description: ''
    patch:
      operationId: v1_catalogo_pisos_partial_update
      parameters:
      - in: path
        name: producto
        schema:
          type: integer
        description: Un valor único que identifique este producto piso.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductoPiso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductoPiso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductoPiso'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPiso'
          description: ''
    delete:
      operationId: v1_catalogo_pisos_destroy
      parameters:
      - in: path
        name: producto
        schema:
          type: integer
        description: Un valor único que identifique este producto piso.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalogo/productos/:
    get:
      operationId: v1_catalogo_productos_list
      parameters:
      - in: query
        name: acabado
        schema:
          type: integer
      - in: query
        name: activo
        schema:
          type: boolean
      - in: query
        name: categoria
        schema:
          type: integer
      - in: query
        name: color_primario
        schema:
          type: integer
      - in: query
        name: diseno
        schema:
          type: integer
      - in: query
        name: espesor_mm
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
      - in: query
        name: estado_stock
        schema:
          enum:
          - SIN_EXISTENCIAS
          - STOCK_BAJO
          - NORMAL
          - SIN_MINIMO
          - BAJO_PEDIDO
          type: string
          minLength: 1
        description: |-
          * `SIN_EXISTENCIAS` - SIN_EXISTENCIAS
          * `STOCK_BAJO` - STOCK_BAJO
          * `NORMAL` - NORMAL
          * `SIN_MINIMO` - SIN_MINIMO
          * `BAJO_PEDIDO` - BAJO_PEDIDO
      - in: query
        name: familia
        schema:
          type: integer
      - in: query
        name: marca
        schema:
          type: integer
      - in: query
        name: material
        schema:
          type: integer
      - in: query
        name: modalidad_abastecimiento
        schema:
          enum:
          - CON_STOCK
          - BAJO_PEDIDO
          type: string
          minLength: 1
        description: |-
          * `CON_STOCK` - CON_STOCK
          * `BAJO_PEDIDO` - BAJO_PEDIDO
      - in: query
        name: modelo
        schema:
          type: string
          maxLength: 150
          minLength: 1
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: tipo
        schema:
          type: integer
      - in: query
        name: unidad_stock
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoList'
          description: ''
    post:
      operationId: v1_catalogo_productos_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Producto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Producto'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          description: ''
  /api/v1/catalogo/productos/{id}/:
    get:
      operationId: v1_catalogo_productos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este producto.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
