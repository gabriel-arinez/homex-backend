name: PRF03 normalize backend changes

on:
  push:
    branches: [feat/prf03-configurador-backend]
    paths: [.github/workflows/prf03-normalize.yml]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prf03-configurador-backend
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: |
          uv run ruff check --fix apps/catalogo/atributos_mueble.py apps/proformas/api/serializers.py apps/proformas/validacion_tecnica.py tests/api/test_prf03_configurador.py
          uv run ruff format apps/catalogo/atributos_mueble.py apps/proformas/api/serializers.py apps/proformas/validacion_tecnica.py tests/api/test_prf03_configurador.py
          uv run ruff check .
          uv run ruff format --check .
      - name: Publish validated style
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/catalogo/atributos_mueble.py apps/proformas/api/serializers.py apps/proformas/validacion_tecnica.py tests/api/test_prf03_configurador.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(prf03): normalizar backend con Ruff"
            git push origin HEAD:feat/prf03-configurador-backend
          fi
