name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  worker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra worker
      - name: Verify worker runtime imports
        run: >-
          uv run python -c
          "import celery, redis, faster_whisper;
          from homex_nlp.asr import AsrService;
          print('worker-runtime-ok')"

  django-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py migrate --noinput

  tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -ra

  concurrency-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -ra -m concurrency

  openapi-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
      - run: diff -u docs/openapi.yaml /tmp/openapi.yaml

  postgres-privileges:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      F076_ADMIN_DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Verify migrator/runtime PostgreSQL privileges
        run: uv run python scripts/verificar_privilegios_runtime.py


  f08-real-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_f084
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_f084
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_f084@127.0.0.1:5432/homex_f084
      CELERY_BROKER_URL: redis://127.0.0.1:6379/15
      DJANGO_SETTINGS_MODULE: config.settings.integration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra worker
      - run: uv run python manage.py migrate --noinput
      - name: Start real Celery worker
        run: |
          uv run celery -A config worker --pool=solo --loglevel=INFO > /tmp/f084-worker.log 2>&1 &
          echo $! > /tmp/f084-worker.pid
      - name: Wait for worker readiness
        run: |
          for attempt in {1..30}; do
            if uv run celery -A config inspect ping --timeout=1 | grep -q pong; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/f084-worker.log
          exit 1
      - name: Verify PostgreSQL, Redis, worker and fixed NLP wheel
        run: uv run python scripts/verificar_integracion_f084.py
      - name: Show worker log on failure
        if: failure()
        run: cat /tmp/f084-worker.log

  f09-frontend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_f09
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_f09
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
      DJANGO_SECRET_KEY: f09-integration-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4174
      DATABASE_URL: postgresql://postgres:homex_f09@127.0.0.1:5432/homex_f09
      CELERY_BROKER_URL: redis://127.0.0.1:6379/14
      DJANGO_SETTINGS_MODULE: config.settings.integration
      HOMEX_ASR_DEVICE: cpu
      HOMEX_ASR_COMPUTE_TYPE: int8
      HOMEX_AUDIO_TTL_SECONDS: 3600
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-frontend
          ref: 57c32d3aa2c2e46fbcc7136f6a90995b67c664ea
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/cache@v4
        with:
          path: .cache/f09-asr
          key: faster-whisper-base-v1
      - run: uv sync --locked --extra dev --extra worker
      - name: Verify the OpenAPI consumed by Vue
        run: uv run python scripts/verificar_contrato_frontend_f09.py frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install deterministic speech fixture generator
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Prepare PostgreSQL and commercial fixtures
        run: |
          uv run python manage.py migrate --noinput
          uv run python scripts/preparar_integracion_frontend_f09.py
      - name: Prepare local ASR model and ephemeral audio
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/f09-asr
          FE08_AUDIO_FIXTURE: ${{ runner.temp }}/cotizacion-f09.wav
        run: |
          uv run python scripts/preparar_modelo_asr_f09.py "$HOMEX_ASR_MODEL_PATH"
          espeak-ng -v es-la -s 115 -g 10 -w "$FE08_AUDIO_FIXTURE" "tres mesas, total cien bolivianos"
      - name: Start API, worker and outbox publisher
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/f09-asr
          HOMEX_AUDIO_TEMP_ROOT: ${{ runner.temp }}/homex-audio-f09
        run: |
          mkdir -p "$HOMEX_AUDIO_TEMP_ROOT"
          uv run celery -A config worker --pool=solo --loglevel=INFO > "$RUNNER_TEMP/f09-worker.log" 2>&1 &
          uv run celery -A config beat --loglevel=INFO > "$RUNNER_TEMP/f09-beat.log" 2>&1 &
          uv run python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/f09-api.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ >/dev/null && \
               uv run celery -A config inspect ping --timeout=1 | grep -q pong; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/f09-api.log" "$RUNNER_TEMP/f09-worker.log" "$RUNNER_TEMP/f09-beat.log"
          exit 1
      - name: Run the frontend E2E against this backend revision
        working-directory: frontend
        env:
          FE08_AUDIO_FIXTURE: ${{ runner.temp }}/cotizacion-f09.wav
        run: npm run test:integration
      - name: Verify backend authority and persisted evidence
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/f09-asr
          HOMEX_AUDIO_TEMP_ROOT: ${{ runner.temp }}/homex-audio-f09
        run: uv run python scripts/verificar_integracion_frontend_f09.py
      - name: Verify documents and persistent media through public APIs
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/f09-asr
          HOMEX_AUDIO_TEMP_ROOT: ${{ runner.temp }}/homex-audio-f09
        run: uv run python scripts/verificar_superficies_frontend_f09.py
      - name: Upload shared integration evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f09-frontend-backend-evidence
          path: |
            frontend/test-results/playwright-integration/
            ${{ runner.temp }}/f09-api.log
            ${{ runner.temp }}/f09-worker.log
            ${{ runner.temp }}/f09-beat.log
          if-no-files-found: ignore
          retention-days: 7

  f10-deploy-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: homex_f10
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_f10
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: f10-runtime-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_f10@127.0.0.1:5432/homex_f10
      DJANGO_SETTINGS_MODULE: config.settings.production
      HOMEX_HTTPS_ENABLED: "0"
      HOMEX_MEDIA_STORAGE: filesystem
      HOMEX_MEDIA_ROOT: ${{ runner.temp }}/homex-f10-media
      HOMEX_AUDIO_TEMP_ROOT: ${{ runner.temp }}/homex-f10-audio
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-deploy
          ref: fb9c321324cfc621ac07cc42fdeb1e3257a968ab
          path: deploy
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Verify fixed D05/D06 deploy contract
        run: >-
          uv run python scripts/verificar_contrato_deploy_f10.py deploy
          --deploy-revision fb9c321324cfc621ac07cc42fdeb1e3257a968ab
      - name: Prepare isolated persistent and ephemeral roots
        run: mkdir -p "$HOMEX_MEDIA_ROOT" "$HOMEX_AUDIO_TEMP_ROOT"
      - name: Apply migrations from an empty PostgreSQL database
        run: uv run python manage.py migrate --noinput
      - name: Verify production runtime and readiness
        run: uv run python scripts/verificar_runtime_f10.py
      - name: Verify idempotent migrations
        run: uv run python manage.py migrate --noinput
