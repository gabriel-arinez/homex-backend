name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  django-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py migrate --noinput

  tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -ra

  concurrency-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -ra -m concurrency

  openapi-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py spectacular --file /tmp/openapi.yaml --validate
      - run: diff -u docs/openapi.yaml /tmp/openapi.yaml
