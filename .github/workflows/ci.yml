name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: DJANGO_SETTINGS_MODULE=config.settings.local uv run python manage.py migrate --noinput
      - run: DJANGO_SETTINGS_MODULE=config.settings.local uv run pytest -m postgresql
      - run: DJANGO_SETTINGS_MODULE=config.settings.test uv run python manage.py spectacular --file docs/openapi.yaml --validate
