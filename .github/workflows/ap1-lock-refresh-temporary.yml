name: AP1 lock refresh (temporary)
on:
  push:
    branches:
      - chore/ap1-auditoria-vulnerabilidades-python
permissions:
  contents: read
jobs:
  refresh:
    if: github.ref == 'refs/heads/chore/ap1-auditoria-vulnerabilidades-python'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Re-resolve only security targets
        run: uv lock --upgrade-package pillow --upgrade-package pyjwt --upgrade-package pytest
      - name: Assert lock generated and syntactically valid
        run: |
          uv lock --check
          git diff --check
          git status --short
      - name: Commit resolved lock to this AP1 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(ap1): regenerar uv.lock tras parches de seguridad"
            git push origin HEAD:refs/heads/chore/ap1-auditoria-vulnerabilidades-python
          fi
