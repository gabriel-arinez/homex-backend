name: Temporary PDF formatting
on:
  push:
    branches:
      - feat/perfeccionamiento-documento-pdf
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-pdf]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perfeccionamiento-documento-pdf
      - uses: astral-sh/setup-uv@v6
      - name: Apply official Ruff formatting to changed files
        run: |
          uvx --from ruff==0.16.8 ruff check --fix apps/documentos/pdf.py tests/api/test_pdf_cover_document.py
          uvx --from ruff==0.16.8 ruff format apps/documentos/pdf.py tests/api/test_pdf_cover_document.py
      - name: Commit formatting
        run: |
          git config user.name homex-ci
          git config user.email homex-ci@users.noreply.github.com
          git add apps/documentos/pdf.py tests/api/test_pdf_cover_document.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(pdf): normalize ReportLab pagination formatting'
            git push origin HEAD:feat/perfeccionamiento-documento-pdf
          fi
