name: Sync OpenAPI FE05

on:
  push:
    branches:
      - feat/fe05-contrato-operaciones

permissions:
  contents: write

jobs:
  sync-openapi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: testserver
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://postgres:homex_test@127.0.0.1:5432/homex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python manage.py spectacular --file docs/openapi.yaml --validate
      - name: Commit generated schema
        run: |
          if git diff --quiet -- docs/openapi.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml
          git commit -m "docs: sincroniza OpenAPI FE05"
          git push
