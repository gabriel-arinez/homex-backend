name: Temporary PDF Ruff formatter
on:
  push:
    branches:
      - feat/perfeccionamiento-documento-pdf
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[run-pdf-formatter]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perfeccionamiento-documento-pdf
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from ruff==0.16.8 ruff check --fix apps/documentos/pdf.py
      - run: uvx --from ruff==0.16.8 ruff format apps/documentos/pdf.py
      - name: Push only formatting changes
        run: |
          git config user.name 'homex-ci'
          git config user.email 'homex-ci@users.noreply.github.com'
          git add apps/documentos/pdf.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(pdf): apply Ruff to commercial PDF generator'
            git push origin HEAD:feat/perfeccionamiento-documento-pdf
          fi
